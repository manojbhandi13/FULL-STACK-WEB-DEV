<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <!-- <link rel="icon" type="image/x-icon" href="fav.png"> -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div>
      <button class="buttons" id="refresh-button">Clear the Board</button>
    </div>

    <div id="main-arena">
      <div id="user-board">
        <div id="user-score-div">
          <p id="user-score">0</p>
        </div>

        <div id="user-label">
          <p>You</p>
        </div>
      </div>

      <div id="board-background">
        <div class="game-box" id="0">T</div>
        <div class="game-box" id="1">I</div>
        <div class="game-box" id="2">C</div>
        <div class="game-box" id="3">T</div>
        <div class="game-box" id="4">A</div>
        <div class="game-box" id="5">C</div>
        <div class="game-box" id="6">T</div>
        <div class="game-box" id="7">O</div>
        <div class="game-box" id="8">E</div>
      </div>

      <div id="comp-board">
        <div id="comp-score-div">
          <p id="comp-score">0</p>
        </div>

        <div id="comp-label">
          <p>Computer</p>
        </div>
      </div>
    </div>

    <button class="buttons" id="reset-button">Reset</button>

    <script src="logic.js"></script>
  </body>
</html>
