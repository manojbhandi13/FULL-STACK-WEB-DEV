<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-Box</title>
</head>
<body>
    <h1>Select your Hobbies:</h1>
    <form action="/server">
        <label for="gym">Hitting Gym:</label>
        <input type="checkbox" id="gym" name="ans1" value="fit">
        <label for="photo">Photography:</label>
        <input type="checkbox" id="photo" name="ans" value="p">
        <button>Submit</button>
    </form>
</body>
</html>
