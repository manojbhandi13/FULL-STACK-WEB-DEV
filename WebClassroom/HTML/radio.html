<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio-Buttons</title>
</head>
<body>
    <h1>Which has more protein?</h1>
    <form action="/server">
        <input type="radio" id="chkn" name="prtn" value="chkn">
    <label for="chkn">Chicken</label>
    <input type="radio" id="egg" name="prtn" value="egg">
    <label for="egg">Eggs</label>
    <button>Submit</button>
    </form>
</body>
</html>
