<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Span</title>
</head>
<body>
    <table border="black">
        <caption>Food Menu</caption>
        <thead>
            <tr>
            <th rowspan="2">Item</th>
            <th colspan="2">Price</th>
            </tr>
            <tr>
                <th>INR</th>
                <th>USD</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Chicken</td>
                <td>360</td>
                <td>56.4</td>
            </tr>
            <tr>
                <td>Eggs</td>
                <td>65</td>
                <td>20.56</td>
            </tr>
            <tr>
                <td>Paneer</td>
                <td>98</td>
                <td>40</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
