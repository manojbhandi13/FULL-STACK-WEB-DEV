<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropDowns</title>
</head>
<body>
    <form action="/server">

        <button>Submit</button>
    </form>
</body>
</html>
