<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Labels</title>
</head>
<body>
    <form action="/action">
        <label>
            Enter UserName: 
            <input type="text" placeholder="uname">
        </label>
        <label>
            Enter PassWord:
            <input type="password" placeholder="passkey">
        </label>
    </form>
</body>
</html>
