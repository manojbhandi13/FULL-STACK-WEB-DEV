<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tables</title>
</head>
<body>
        <table border="black">
        <caption>Food Menu</caption>
        <thead>
            <tr>
            <th>Item</th>
            <th>Price</th>
        </tr>
        </thead>
       <tbody>
         <tr>
            <td>Chicken</td>
            <td>360</td>
        </tr>
        <tr>
            <td>Eggs</td>
            <td>65</td>
        </tr>
        <tr >
            <td>Paneer</td>
            <td>98</td>
        </tr>
       </tbody>
       <tfoot>
        <tr>
            <td>Total</td>
            <td>523</td>
        </tr>
       </tfoot>
    </table>
</body>
</html>
