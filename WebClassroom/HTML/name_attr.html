<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name Attribute</title>
</head>
<body>
    <form action="/server">
        <label for="username">Enter Username: </label>
        <input type="text" placeholder="username" id="username" name="uname">
        <br>
        <label for="passwd">Enter Password: </label>
        <input type="password" placeholder="password" id="passwd" name="pd">
        <br>
        <button>Submit</button>
    </form>
</body>
</html>
